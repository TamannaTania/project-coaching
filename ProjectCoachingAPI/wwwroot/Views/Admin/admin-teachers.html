<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-900 p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-gradient-to-br from-purple-900 to-indigo-700 p-8 rounded-3xl shadow-xl border border-purple-800/50">
            <div>
                <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">Manage Teachers</h1>
                <p class="text-purple-200 font-medium text-lg">Add and organize teachers for the homepage.</p>
            </div>
            <a href="/Views/Admin/admin.html" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 backdrop-blur-sm px-6 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Add Form -->
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-md border border-slate-100 h-fit sticky top-8">
                <h2 id="formTitle" class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-purple-500"></i> Add New Teacher
                </h2>
                <form id="teacherForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Name <span class="text-red-500">*</span></label>
                        <input type="text" id="tName" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Designation</label>
                        <input type="text" id="tDesignation" placeholder="e.g. Senior Instructor" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Subject</label>
                        <input type="text" id="tSubject" placeholder="e.g. Physics" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Image URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="tImage" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                            <button type="button" onclick="document.getElementById('tFile').click()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 rounded-lg text-sm font-medium transition" title="Upload Image">
                                <i class="fa-solid fa-upload"></i>
                            </button>
                        </div>
                        <input type="file" id="tFile" class="hidden" accept="image/*" onchange="uploadImage(this)">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Bio</label>
                        <textarea id="tBio" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Facebook URL</label>
                        <input type="text" id="tFacebook" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">LinkedIn URL</label>
                        <input type="text" id="tLinkedIn" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl shadow-md transition-colors mt-4">
                        <i class="fa-solid fa-plus"></i> Save Teacher
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl shadow-sm transition-colors mt-2">Cancel Edit</button>
                </form>
            </div>

            <!-- List -->
            <div class="md:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-users text-indigo-500"></i> Existing Teachers
                    </h2>
                    <div id="teachersList" class="space-y-4">
                        <div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><p>Loading...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/Scripts/Admin/admin-teachers.js"></script>
</body>
</html>
