<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Free Classes</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-900 p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-gradient-to-br from-purple-900 to-indigo-700 p-8 rounded-3xl shadow-xl border border-purple-800/50">
            <div>
                <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">Manage Free Classes</h1>
                <p class="text-purple-200 font-medium text-lg">Add and organize free video classes for the homepage.</p>
            </div>
            <a href="/Views/Admin/admin.html" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 backdrop-blur-sm px-6 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Add Form -->
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-md border border-slate-100 h-fit sticky top-8">
                <h2 id="formTitle" class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-youtube text-red-500"></i> Add New Free Class
                </h2>
                
                <form id="freeClassForm" class="space-y-4">
                    <input type="hidden" id="fcId">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Title</label>
                            <input type="text" id="fcTitle" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Category (e.g. HSC Physics)</label>
                            <input type="text" id="fcCategory" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Video URL (YouTube)</label>
                            <input type="url" id="fcVideo" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Thumbnail URL (Image)</label>
                            <input type="url" id="fcThumb" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Description</label>
                            <textarea id="fcDesc" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500" required></textarea>
                        </div>
                    </div>
                    <div class="pt-2">
                        <button type="submit" id="saveBtn" class="w-full bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-emerald-700 transition">Add Class</button>
                    </div>
                </form>

            </div>

            <!-- List -->
            <div class="md:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-video text-indigo-500"></i> Existing Free Classes
                    </h2>
                    <div id="teachersList" class="space-y-4">
                        <div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><p>Loading...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/Scripts/Admin/admin-freeclasses.js"></script>
</body>
</html>
