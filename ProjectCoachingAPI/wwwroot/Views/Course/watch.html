<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও ক্লাস প্লেয়ার - PhysicsAcademy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/Scripts/Common/session-guard.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header id="mainNav" class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <!-- Left: Back Button & Course Title -->
            <div class="flex items-center gap-3 sm:gap-4 overflow-hidden">
                <button id="backBtn" onclick="goBack()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-700/80 transition-all flex-shrink-0 shadow-sm active:scale-95">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="hidden sm:inline">কোর্সে ফিরুন</span>
                    <span class="sm:hidden">ফিরুন</span>
                </button>
                <div class="h-5 w-px bg-slate-800 hidden sm:block"></div>
                <div class="truncate">
                    <span id="navCourseTitle" class="text-xs sm:text-sm font-bold text-white truncate block">কোর্স লোড হচ্ছে...</span>
                    <span class="text-[11px] text-blue-400 font-medium hidden sm:block">PhysicsAcademy • অনলাইন লার্নিং</span>
                </div>
            </div>

            <!-- Right: Logo & User Info -->
            <div class="flex items-center gap-3 flex-shrink-0">
                <a href="/" class="hidden md:flex items-center gap-2 text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-atom text-blue-500 text-xl"></i>
                    <span class="font-extrabold text-sm tracking-tight">PhysicsAcademy</span>
                </a>
                <div id="userBadge" class="flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-full text-xs text-slate-300">
                    <i class="fa-solid fa-circle-user text-blue-400 text-sm"></i>
                    <span id="userNameDisplay" class="font-medium">শিক্ষার্থী</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
            
            <!-- LEFT COLUMN: Video Player & Control Bar -->
            <section class="lg:col-span-8 flex flex-col gap-4">
                
                <!-- Cinema Video Container -->
                <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800/90 relative aspect-video flex items-center justify-center group">
                    <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain focus:outline-none">
                        <source id="videoSource" src="" type="video/mp4">
                        আপনার ব্রাউজারে ভিডিও চলতে সমস্যা হচ্ছে। দয়া করে আধুনিক ব্রাউজার ব্যবহার করুন।
                    </video>
                    
                    <!-- Loading Spinner Overlay -->
                    <div id="videoLoader" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 pointer-events-none">
                        <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                        <span class="text-xs text-slate-300 font-medium">ভিডিও লোড হচ্ছে...</span>
                    </div>
                </div>

                <!-- Lecture Info & Navigation Card -->
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg flex flex-col gap-4">
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800/80 pb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="bg-blue-500/20 text-blue-400 border border-blue-400/30 text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1.5">
                                    <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                                    <span>ভিডিও ক্লাস</span>
                                </span>
                                <span id="currentChapterName" class="text-xs text-slate-400 font-medium truncate">চ্যাপ্টার ১</span>
                            </div>
                            <h1 id="lectureTitle" class="text-lg sm:text-xl md:text-2xl font-extrabold text-white leading-tight">
                                লেকচার লোড হচ্ছে...
                            </h1>
                        </div>

                        <!-- Previous / Next Action Buttons -->
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button id="btnPrevLecture" onclick="playPreviousLecture()" disabled class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 disabled:cursor-not-allowed border border-slate-700 transition flex items-center gap-2">
                                <i class="fa-solid fa-backward-step"></i>
                                <span class="hidden sm:inline">আগের ক্লাস</span>
                            </button>
                            <button id="btnNextLecture" onclick="playNextLecture()" disabled class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-blue-600 text-white hover:bg-blue-500 disabled:opacity-40 disabled:hover:bg-blue-600 disabled:cursor-not-allowed shadow-md shadow-blue-600/30 transition flex items-center gap-2">
                                <span>পরের ক্লাস</span>
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Speed & Controls Row -->
                    <div class="flex flex-wrap items-center justify-between gap-3 text-xs text-slate-400">
                        <div class="flex items-center gap-2">
                            <span class="font-medium text-slate-400 flex items-center gap-1.5">
                                <i class="fa-solid fa-gauge-high text-blue-400"></i> প্লেব্যাক স্পিড:
                            </span>
                            <div class="flex items-center bg-slate-950 rounded-lg p-1 border border-slate-800">
                                <button onclick="setSpeed(0.75)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">0.75x</button>
                                <button onclick="setSpeed(1.0)" class="speed-btn active-speed px-2 py-0.5 rounded text-[11px] font-bold bg-blue-600 text-white transition">1x</button>
                                <button onclick="setSpeed(1.25)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">1.25x</button>
                                <button onclick="setSpeed(1.5)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">1.5x</button>
                                <button onclick="setSpeed(2.0)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">2x</button>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <button onclick="toggleTheaterMode()" class="hover:text-blue-400 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-expand text-slate-400"></i> <span>ফুলস্ক্রিন</span>
                            </button>
                        </div>
                    </div>

                </div>

            </section>

            <!-- RIGHT COLUMN: Course Playlist & Materials -->
            <aside class="lg:col-span-4 bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col max-h-[calc(100vh-140px)] sticky top-20">
                
                <!-- Playlist Header -->
                <div class="p-4 sm:p-5 bg-gradient-to-r from-slate-900 to-blue-950/60 border-b border-slate-800 flex items-center justify-between">
                    <div>
                        <h3 class="font-extrabold text-sm sm:text-base text-white flex items-center gap-2">
                            <i class="fa-solid fa-list-ul text-blue-400"></i>
                            <span>কোর্স সূচিপত্র</span>
                        </h3>
                        <p id="playlistSubtext" class="text-xs text-slate-400 mt-0.5">সব ক্লাস ও স্টাডি মেটেরিয়াল</p>
                    </div>
                    <span id="lectureCountBadge" class="bg-blue-500/20 text-blue-400 border border-blue-500/30 text-xs font-bold px-2.5 py-1 rounded-full">
                        0 ক্লাস
                    </span>
                </div>

                <!-- Playlist Items (Scrollable) -->
                <div id="playlistContainer" class="p-3 sm:p-4 overflow-y-auto custom-scrollbar flex flex-col gap-3 flex-1">
                    <div class="text-center py-8 text-slate-500 text-xs">
                        <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                        <p>সূচিপত্র লোড হচ্ছে...</p>
                    </div>
                </div>

            </aside>

        </div>
    </main>

    <!-- Watch Script -->
    <script src="/Scripts/Course/watch.js"></script>
</body>
</html>
