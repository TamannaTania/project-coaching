<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PhysicsAcademy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .hero-bg {
            background: linear-gradient(135deg, #0f172a 0%, #172554 50%, #0f172a 100%);
        }
    </style>
</head>
<body class="hero-bg font-sans text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 md:p-12 rounded-2xl shadow-xl max-w-md w-full border border-slate-100">
        <div class="text-center mb-8">
            <a href="/" class="text-inherit no-underline">
                <i class="fa-solid fa-user-plus text-5xl text-blue-600 mb-4 hover:scale-105 transition-transform"></i>
            </a>
            <h2 class="text-3xl font-bold text-slate-900">Create Account</h2>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-slate-700 font-bold mb-1">Username</label>
                <input type="text" id="username" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-1">Email</label>
                <input type="email" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            
            <div id="errorMsg" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm font-medium text-center"></div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold rounded-lg px-4 py-3 mt-4 hover:bg-blue-700 transition shadow-lg shadow-blue-600/30">
                Register
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-slate-500">
            Already have an account? <a href="/Views/Auth/login.html" class="text-blue-600 font-bold hover:underline">Login</a>
        </div>
    </div>

    <!-- Register Script -->
    <script src="/Scripts/Auth/register.js"></script>
</body>
</html>
