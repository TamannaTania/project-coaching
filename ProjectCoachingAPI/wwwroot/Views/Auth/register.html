<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Physics Classroom</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hero-bg {
            background: radial-gradient(circle at top right, #064e3b 0%, #0f172a 50%, #022c22 100%);
        }
        .glass-card {
            background: #ffffff;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        .input-focus {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-focus:focus {
            background-color: #ffffff;
            border-color: #059669;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12);
        }
    </style>
</head>
<body class="hero-bg min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

    <div class="glass-card max-w-[420px] w-full rounded-3xl p-8 sm:p-10 border border-slate-100">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-block transition-transform hover:scale-105 duration-200">
                <img src="/Images/logo.png" onerror="this.src='/favicon.png'" alt="Physics Classroom Logo" class="h-14 w-14 mx-auto mb-3 object-contain drop-shadow-sm">
            </a>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Account</h1>
            <p class="text-xs text-slate-500 mt-1.5 font-medium">Get started with Physics Classroom</p>
        </div>

        <!-- Form -->
        <form id="registerForm" class="space-y-5">
            <!-- Full Name -->
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                    Full Name <span class="text-emerald-600">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                    <input type="text" id="username" placeholder="e.g. John Doe" required
                        class="input-focus w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none">
                </div>
            </div>

            <!-- Phone or Email -->
            <div>
                <label for="identifier" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                    Phone or Email <span class="text-emerald-600">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-regular fa-address-card text-sm"></i>
                    </span>
                    <input type="text" id="identifier" placeholder="01XXXXXXXXX or name@gmail.com" required
                        class="input-focus w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none">
                </div>
                <p class="text-[11px] text-slate-400 mt-1.5 font-medium">Use either your mobile number or email to sign in.</p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                    Password <span class="text-emerald-600">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" placeholder="At least 4 characters" minlength="4" required
                        class="input-focus w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none">
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <i class="fa-regular fa-eye" id="toggleEyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Alerts -->
            <div id="errorMsg" class="hidden bg-rose-50 border border-rose-200 text-rose-600 p-3 rounded-xl text-xs font-semibold text-center"></div>
            <div id="successMsg" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl text-xs font-bold text-center"></div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-xl text-sm transition-all shadow-lg shadow-emerald-600/25 hover:shadow-emerald-600/35 active:scale-[0.99] flex items-center justify-center gap-2">
                <span>Create Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500 font-medium">
                Already have an account? 
                <a href="/Views/Auth/login.html" class="text-emerald-600 font-bold hover:text-emerald-700 hover:underline ml-1">
                    Log In
                </a>
            </p>
        </div>
    </div>

    <!-- Script -->
    <script src="/Scripts/Auth/register.js?v=20261102_2"></script>
</body>
</html>
