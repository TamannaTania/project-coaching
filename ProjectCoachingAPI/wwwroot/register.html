                <label class="block text-slate-700 font-bold mb-1 text-sm">
                    ইমেইল <span class="text-xs font-normal text-slate-400">(ঐচ্ছিক / না থাকলে ফাঁকা রাখুন)</span>
                </label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-400 text-sm"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" placeholder="name@example.com (না থাকলে ফাঁকা রাখুন)" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-1 text-sm">পাসওয়ার্ড (Password) <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-400 text-sm"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" placeholder="কমপক্ষে ৪ সংখ্যার পাসওয়ার্ড দিন" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required minlength="4">
                </div>
            </div>
            
            <div id="errorMsg" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm font-medium text-center border border-red-200"></div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold rounded-lg px-4 py-3 mt-4 hover:bg-blue-700 transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> অ্যাকাউন্ট তৈরি করুন
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-slate-500">
            Already have an account? <a href="/Views/Auth/login.html" class="text-blue-600 font-bold hover:underline">Login</a>
        </div>
    </div>

    <!-- Register Script -->
    <script src="/Scripts/Auth/register.js?v=20261029_2"></script>
