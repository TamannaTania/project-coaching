<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PhysicsAcademy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hero-bg {
            background: linear-gradient(150deg, #d4e0c8 0%, #6bc117 40%, #172114 100%);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 md:p-12 rounded-2xl shadow-xl max-w-md w-full border border-slate-100">
        <div class="text-center mb-8">
            <i class="fa-solid fa-user-plus text-5xl text-[#6bc117] mb-4"></i>
            <h2 class="text-3xl font-bold text-slate-900">Create Account</h2>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-slate-700 font-bold mb-1">Username</label>
                <input type="text" id="username" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500" required>
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-1">Email</label>
                <input type="email" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500" required>
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500" required>
            </div>
            
            <div id="errorMsg" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm font-medium text-center"></div>

            <button type="submit" id="submitBtn" class="w-full bg-[#6bc117] text-white font-bold rounded-lg px-4 py-3 mt-4 hover:bg-[#5ba712] transition">
                Register
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-slate-500">
            Already have an account? <a href="login.html" class="text-[#6bc117] font-bold hover:underline">Login</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.innerText = 'Creating...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/Auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    window.location.href = 'login.html';
                } else {
                    const data = await response.json();
                    errorMsg.innerText = data.message || "Registration failed.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = "Connection error.";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerText = 'Register';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
