<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও ক্লাস প্লেয়ার - PhysicsAcademy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
        }
        /* Custom scrollbar for playlist */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header id="mainNav" class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <!-- Left: Back Button & Course Title -->
            <div class="flex items-center gap-3 sm:gap-4 overflow-hidden">
                <button id="backBtn" onclick="goBack()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-700/80 transition-all flex-shrink-0 shadow-sm active:scale-95">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="hidden sm:inline">কোর্সে ফিরুন</span>
                    <span class="sm:hidden">ফিরুন</span>
                </button>
                <div class="h-5 w-px bg-slate-800 hidden sm:block"></div>
                <div class="truncate">
                    <span id="navCourseTitle" class="text-xs sm:text-sm font-bold text-white truncate block">কোর্স লোড হচ্ছে...</span>
                    <span class="text-[11px] text-blue-400 font-medium hidden sm:block">PhysicsAcademy • অনলাইন লার্নিং</span>
                </div>
            </div>

            <!-- Right: Logo & User Info -->
            <div class="flex items-center gap-3 flex-shrink-0">
                <a href="/" class="hidden md:flex items-center gap-2 text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-atom text-blue-500 text-xl"></i>
                    <span class="font-extrabold text-sm tracking-tight">PhysicsAcademy</span>
                </a>
                <div id="userBadge" class="flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-full text-xs text-slate-300">
                    <i class="fa-solid fa-circle-user text-blue-400 text-sm"></i>
                    <span id="userNameDisplay" class="font-medium">শিক্ষার্থী</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
            
            <!-- LEFT COLUMN: Video Player & Control Bar (8 cols on desktop) -->
            <section class="lg:col-span-8 flex flex-col gap-4">
                
                <!-- Cinema Video Container -->
                <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800/90 relative aspect-video flex items-center justify-center group">
                    <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain focus:outline-none">
                        <source id="videoSource" src="" type="video/mp4">
                        আপনার ব্রাউজারে ভিডিও চলতে সমস্যা হচ্ছে। দয়া করে আধুনিক ব্রাউজার ব্যবহার করুন।
                    </video>
                    
                    <!-- Loading Spinner Overlay -->
                    <div id="videoLoader" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 pointer-events-none">
                        <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                        <span class="text-xs text-slate-300 font-medium">ভিডিও লোড হচ্ছে...</span>
                    </div>
                </div>

                <!-- Lecture Info & Navigation Card -->
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg flex flex-col gap-4">
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800/80 pb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="bg-blue-500/20 text-blue-400 border border-blue-400/30 text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1.5">
                                    <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                                    <span>ভিডিও ক্লাস</span>
                                </span>
                                <span id="currentChapterName" class="text-xs text-slate-400 font-medium truncate">চ্যাপ্টার ১</span>
                            </div>
                            <h1 id="lectureTitle" class="text-lg sm:text-xl md:text-2xl font-extrabold text-white leading-tight">
                                লেকচার লোড হচ্ছে...
                            </h1>
                        </div>

                        <!-- Previous / Next Action Buttons -->
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button id="btnPrevLecture" onclick="playPreviousLecture()" disabled class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 disabled:cursor-not-allowed border border-slate-700 transition flex items-center gap-2">
                                <i class="fa-solid fa-backward-step"></i>
                                <span class="hidden sm:inline">আগের ক্লাস</span>
                            </button>
                            <button id="btnNextLecture" onclick="playNextLecture()" disabled class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-blue-600 text-white hover:bg-blue-500 disabled:opacity-40 disabled:hover:bg-blue-600 disabled:cursor-not-allowed shadow-md shadow-blue-600/30 transition flex items-center gap-2">
                                <span>পরের ক্লাস</span>
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Speed & Controls Row -->
                    <div class="flex flex-wrap items-center justify-between gap-3 text-xs text-slate-400">
                        <div class="flex items-center gap-2">
                            <span class="font-medium text-slate-400 flex items-center gap-1.5">
                                <i class="fa-solid fa-gauge-high text-blue-400"></i> প্লেব্যাক স্পিড:
                            </span>
                            <div class="flex items-center bg-slate-950 rounded-lg p-1 border border-slate-800">
                                <button onclick="setSpeed(0.75)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">0.75x</button>
                                <button onclick="setSpeed(1.0)" class="speed-btn active-speed px-2 py-0.5 rounded text-[11px] font-bold bg-blue-600 text-white transition">1x</button>
                                <button onclick="setSpeed(1.25)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">1.25x</button>
                                <button onclick="setSpeed(1.5)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">1.5x</button>
                                <button onclick="setSpeed(2.0)" class="speed-btn px-2 py-0.5 rounded text-[11px] font-bold text-slate-400 hover:text-white transition">2x</button>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <button onclick="toggleTheaterMode()" class="hover:text-blue-400 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-expand text-slate-400"></i> <span>ফুলস্ক্রিন</span>
                            </button>
                        </div>
                    </div>

                </div>

            </section>

            <!-- RIGHT COLUMN: Course Playlist & Materials (4 cols on desktop) -->
            <aside class="lg:col-span-4 bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col max-h-[calc(100vh-140px)] sticky top-20">
                
                <!-- Playlist Header -->
                <div class="p-4 sm:p-5 bg-gradient-to-r from-slate-900 to-blue-950/60 border-b border-slate-800 flex items-center justify-between">
                    <div>
                        <h3 class="font-extrabold text-sm sm:text-base text-white flex items-center gap-2">
                            <i class="fa-solid fa-list-ul text-blue-400"></i>
                            <span>কোর্স সূচিপত্র</span>
                        </h3>
                        <p id="playlistSubtext" class="text-xs text-slate-400 mt-0.5">সব ক্লাস ও স্টাডি মেটেরিয়াল</p>
                    </div>
                    <span id="lectureCountBadge" class="bg-blue-500/20 text-blue-400 border border-blue-500/30 text-xs font-bold px-2.5 py-1 rounded-full">
                        0 ক্লাস
                    </span>
                </div>

                <!-- Playlist Items (Scrollable) -->
                <div id="playlistContainer" class="p-3 sm:p-4 overflow-y-auto custom-scrollbar flex flex-col gap-3 flex-1">
                    <div class="text-center py-8 text-slate-500 text-xs">
                        <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                        <p>সূচিপত্র লোড হচ্ছে...</p>
                    </div>
                </div>

            </aside>

        </div>
    </main>

    <script>
        // Parse Query Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('courseId');
        let currentVideoUrl = urlParams.get('url') || '';
        let currentTitle = urlParams.get('title') || '';
        const isAppMode = urlParams.get('app') === 'true' || sessionStorage.getItem('isApp') === 'true';

        let courseData = null;
        let allVideoLectures = [];
        let currentIndex = -1;

        // User authentication check
        const token = localStorage.getItem('token');
        const userJson = localStorage.getItem('user');
        if (userJson) {
            try {
                const user = JSON.parse(userJson);
                if (user.fullName) {
                    document.getElementById('userNameDisplay').innerText = user.fullName;
                }
            } catch(e) {}
        }

        // Adjust UI for App mode
        if (isAppMode) {
            sessionStorage.setItem('isApp', 'true');
            const mainNav = document.getElementById('mainNav');
            if (mainNav) {
                mainNav.classList.add('bg-slate-950', 'border-blue-900/40');
            }
        }

        function goBack() {
            if (courseId) {
                window.location.href = `course.html?id=${courseId}${isAppMode ? '&app=true' : ''}`;
            } else if (isAppMode) {
                window.location.href = 'app.html';
            } else {
                window.location.href = '/';
            }
        }

        // Normalize Video URL
        function normalizeUrl(url) {
            if (!url) return '';
            let clean = url;
            if (!clean.startsWith('http://') && !clean.startsWith('https://')) {
                clean = '/' + clean.replace(/^\/+/, '');
            }
            try {
                return encodeURI(decodeURI(clean));
            } catch(e) {
                return clean;
            }
        }

        // Load Course & Validate Enrollment
        async function initPlayer() {
            if (!courseId) {
                alert('কোর্স আইডি পাওয়া যায়নি!');
                window.location.href = '/';
                return;
            }

            if (!token) {
                alert('ভিডিও দেখার জন্য অনুগ্রহ করে লগইন করুন।');
                window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
                return;
            }

            try {
                // Fetch course details with authentication
                const res = await fetch(`/api/Courses/${courseId}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    throw new Error('Course fetch failed');
                }

                courseData = await res.json();
                document.getElementById('navCourseTitle').innerText = courseData.title;

                // Flatten all video lectures
                allVideoLectures = [];
                if (courseData.chapters) {
                    courseData.chapters.forEach((ch, chIdx) => {
                        if (ch.contents) {
                            ch.contents.forEach(item => {
                                if (item.type === 'Video' && item.url) {
                                    allVideoLectures.push({
                                        ...item,
                                        chapterTitle: ch.title,
                                        chapterIndex: chIdx + 1,
                                        normalizedUrl: normalizeUrl(item.url)
                                    });
                                }
                            });
                        }
                    });
                }

                document.getElementById('lectureCountBadge').innerText = allVideoLectures.length + ' ক্লাস';

                // Render Curriculum / Playlist
                renderPlaylist();

                // If no initial video specified in URL, pick the first video
                if (!currentVideoUrl && allVideoLectures.length > 0) {
                    currentVideoUrl = allVideoLectures[0].normalizedUrl;
                    currentTitle = allVideoLectures[0].title;
                }

                if (currentVideoUrl) {
                    setVideo(currentVideoUrl, currentTitle);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('playlistContainer').innerHTML = `
                    <div class="text-center py-8 text-red-400 text-xs">
                        <i class="fa-solid fa-triangle-exclamation text-lg mb-2"></i>
                        <p>কোর্স লোড করা যায়নি। অনুগ্রহ করে পুনরায় লগইন করে চেষ্টা করুন।</p>
                    </div>
                `;
            }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            if (!courseData || !courseData.chapters || courseData.chapters.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">কোনো কনটেন্ট পাওয়া যায়নি।</div>';
                return;
            }

            let html = '';
            courseData.chapters.forEach((ch, chIdx) => {
                const videos = ch.contents ? ch.contents.filter(c => c.type === 'Video') : [];
                const pdfs = ch.contents ? ch.contents.filter(c => c.type !== 'Video') : [];

                html += `
                    <div class="border border-slate-800 rounded-xl overflow-hidden bg-slate-950/40">
                        <div class="p-3 bg-slate-900/90 flex items-center justify-between cursor-pointer border-b border-slate-800/80 select-none" onclick="toggleChapterAccordion('ch-content-${ch.id}', 'ch-icon-${ch.id}')">
                            <div class="flex items-center gap-2.5 overflow-hidden">
                                <span class="w-6 h-6 rounded-lg bg-blue-500/20 text-blue-400 text-xs font-bold flex items-center justify-center flex-shrink-0">
                                    ${chIdx + 1}
                                </span>
                                <h4 class="text-xs font-bold text-slate-200 truncate">${ch.title}</h4>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0 text-slate-400 text-xs">
                                <span>${videos.length} ক্লাস</span>
                                <i id="ch-icon-${ch.id}" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200"></i>
                            </div>
                        </div>

                        <div id="ch-content-${ch.id}" class="p-2 flex flex-col gap-1.5 bg-slate-950/80">
                `;

                if (videos.length === 0 && pdfs.length === 0) {
                    html += '<div class="text-[11px] text-slate-500 italic p-2 text-center">কোনো কনটেন্ট নেই</div>';
                }

                // Render Videos
                videos.forEach((v) => {
                    const normUrl = normalizeUrl(v.url);
                    const isPlaying = normUrl === normalizeUrl(currentVideoUrl);
                    const safeTitle = v.title.replace(/'/g, "\\'");

                    html += `
                        <div onclick="selectLecture('${normUrl}', '${safeTitle}')" 
                             class="lecture-item p-2.5 rounded-xl cursor-pointer transition flex items-center justify-between gap-3 border ${isPlaying ? 'bg-blue-600/20 border-blue-500/50 text-blue-300 font-bold shadow-md shadow-blue-500/10' : 'bg-slate-900/60 border-slate-800/70 text-slate-300 hover:bg-slate-800 hover:text-white'}"
                             data-url="${normUrl}">
                            <div class="flex items-center gap-2.5 overflow-hidden">
                                <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 ${isPlaying ? 'bg-blue-600 text-white animate-pulse' : 'bg-slate-800 text-blue-400'}">
                                    <i class="fa-solid ${isPlaying ? 'fa-circle-play' : 'fa-play'} text-xs"></i>
                                </div>
                                <span class="text-xs truncate">${v.title}</span>
                            </div>
                            ${isPlaying ? '<span class="text-[10px] bg-blue-500 text-white px-2 py-0.5 rounded-full font-bold flex-shrink-0">চলছে</span>' : '<i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>'}
                        </div>
                    `;
                });

                // Render PDFs
                pdfs.forEach((p) => {
                    const normPdf = normalizeUrl(p.url);
                    html += `
                        <a href="${normPdf}" target="_blank" download class="p-2 rounded-xl transition flex items-center justify-between gap-3 border bg-slate-900/30 border-slate-800/50 text-slate-400 hover:text-red-400 hover:bg-slate-800/60 hover:border-red-500/30">
                            <div class="flex items-center gap-2.5 overflow-hidden">
                                <div class="w-7 h-7 rounded-lg bg-red-500/20 text-red-400 flex items-center justify-center flex-shrink-0">
                                    <i class="fa-solid fa-file-pdf text-xs"></i>
                                </div>
                                <span class="text-xs truncate">${p.title}</span>
                            </div>
                            <span class="text-[10px] bg-red-500/20 text-red-300 border border-red-500/30 px-2 py-0.5 rounded-md flex items-center gap-1 flex-shrink-0">
                                <i class="fa-solid fa-download text-[9px]"></i> নোট
                            </span>
                        </a>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleChapterAccordion(contentId, iconId) {
            const el = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (el) {
                el.classList.toggle('hidden');
                if (icon) {
                    icon.classList.toggle('rotate-180');
                }
            }
        }

        // Switch to a new video lecture
        function selectLecture(videoUrl, title) {
            currentVideoUrl = normalizeUrl(videoUrl);
            currentTitle = title;
            setVideo(currentVideoUrl, currentTitle);

            // Update URL without reloading page
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('url', currentVideoUrl);
            newUrl.searchParams.set('title', currentTitle);
            window.history.replaceState({}, '', newUrl);

            // Re-render playlist to highlight active lecture
            renderPlaylist();
        }

        function setVideo(url, title) {
            const player = document.getElementById('videoPlayer');
            const source = document.getElementById('videoSource');
            const loader = document.getElementById('videoLoader');

            if (loader) loader.classList.remove('hidden');

            source.src = url;
            player.load();
            player.play().catch(e => {
                console.log('Autoplay deferred until interaction:', e);
            });

            player.oncanplay = () => {
                if (loader) loader.classList.add('hidden');
            };

            document.getElementById('lectureTitle').innerText = title || 'ভিডিও লেকচার';

            // Find current lecture index
            currentIndex = allVideoLectures.findIndex(v => v.normalizedUrl === url);
            if (currentIndex !== -1) {
                const currentObj = allVideoLectures[currentIndex];
                document.getElementById('currentChapterName').innerText = `${currentObj.chapterTitle || 'চ্যাপ্টার'}`;
            }

            // Update Previous and Next buttons
            const btnPrev = document.getElementById('btnPrevLecture');
            const btnNext = document.getElementById('btnNextLecture');
            if (btnPrev) btnPrev.disabled = (currentIndex <= 0);
            if (btnNext) btnNext.disabled = (currentIndex === -1 || currentIndex >= allVideoLectures.length - 1);
        }

        function playPreviousLecture() {
            if (currentIndex > 0) {
                const prev = allVideoLectures[currentIndex - 1];
                selectLecture(prev.normalizedUrl, prev.title);
            }
        }

        function playNextLecture() {
            if (currentIndex >= 0 && currentIndex < allVideoLectures.length - 1) {
                const next = allVideoLectures[currentIndex + 1];
                selectLecture(next.normalizedUrl, next.title);
            }
        }

        // Auto-advance when video finishes
        document.getElementById('videoPlayer').addEventListener('ended', () => {
            if (currentIndex >= 0 && currentIndex < allVideoLectures.length - 1) {
                playNextLecture();
            }
        });

        // Set Playback Speed
        function setSpeed(rate) {
            const player = document.getElementById('videoPlayer');
            player.playbackRate = rate;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'active-speed');
                btn.classList.add('text-slate-400');
            });
            event.target.classList.remove('text-slate-400');
            event.target.classList.add('bg-blue-600', 'text-white', 'active-speed');
        }

        function toggleTheaterMode() {
            const player = document.getElementById('videoPlayer');
            if (!document.fullscreenElement) {
                if (player.requestFullscreen) {
                    player.requestFullscreen();
                } else if (player.webkitRequestFullscreen) {
                    player.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
