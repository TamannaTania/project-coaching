<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage About Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-900 p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-gradient-to-br from-purple-900 to-indigo-700 p-8 rounded-3xl shadow-xl border border-purple-800/50">
            <div>
                <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">Manage About Section</h1>
                <p class="text-purple-200 font-medium text-lg">Update the About Us section on the homepage.</p>
            </div>
            <a href="admin.html" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 backdrop-blur-sm px-6 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Add Form -->
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-md border border-slate-100 h-fit sticky top-8">
                <h2 id="formTitle" class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-address-card text-emerald-500"></i> Update About Content
                </h2>
                
                
                <form id="aboutForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Title</label>
                        <input type="text" id="abTitle" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">About Image (Upload or URL)</label>
                        <div class="flex gap-2">
                            <input type="file" id="abImgFile" accept="image/*" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:border-emerald-500 text-sm">
                            <input type="text" id="abImg" placeholder="Or paste image URL..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:border-emerald-500 text-sm">
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Optional. Upload a picture from your computer, or paste a link.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Description</label>
                        <textarea id="abDesc" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500" required></textarea>
                    </div>
                    <div class="flex gap-4">
                        <button type="submit" id="saveBtn" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-emerald-700 transition">Update Content</button>
                    </div>
                </form>


            </div>

            <!-- List -->
            <div class="md:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-users text-indigo-500"></i> Current About Content
                    </h2>
                    <div id="teachersList" class="space-y-4">
                        <div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><p>Loading...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadAbout() {
            try {
                const res = await fetch('/api/About');
                if(res.ok) {
                    const data = await res.json();
                    document.getElementById('abTitle').value = data.title;
                    document.getElementById('abImg').value = data.imageUrl;
                    document.getElementById('abDesc').value = data.description;
                    
                    const container = document.getElementById('teachersList');
                    container.innerHTML = `
                        <div class="text-center">
                            <img src="${data.imageUrl}" class="w-full max-h-64 object-cover rounded-xl mb-4">
                            <h3 class="text-2xl font-bold mb-2">${data.title}</h3>
                            <p class="text-slate-600">${data.description}</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('aboutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('abImgFile');
            let imageUrl = document.getElementById('abImg').value;

            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                
                try {
                    const uploadRes = await fetch('/api/Uploads', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                    if (uploadRes.ok) {
                        const uploadData = await uploadRes.json();
                        imageUrl = uploadData.url;
                    }
                } catch (e) {
                    console.error("Upload failed", e);
                }
            }

            if (!imageUrl || imageUrl.trim() === '') {
                imageUrl = 'https://images.unsplash.com/photo-1524169358666-79f22534bc6e?auto=format&fit=crop&q=80&w=800'; // fallback
            }

            const payload = {
                title: document.getElementById('abTitle').value,
                imageUrl: imageUrl,
                description: document.getElementById('abDesc').value
            };

            await fetch('/api/About', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(payload)
            });
            alert("Updated successfully!");
            loadAbout();
        });

        loadAbout();

</script>
</body>
</html>
