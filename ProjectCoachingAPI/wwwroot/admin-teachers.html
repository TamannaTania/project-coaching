<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-900 p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-gradient-to-br from-purple-900 to-indigo-700 p-8 rounded-3xl shadow-xl border border-purple-800/50">
            <div>
                <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">Manage Teachers</h1>
                <p class="text-purple-200 font-medium text-lg">Add and organize teachers for the homepage.</p>
            </div>
            <a href="admin.html" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 backdrop-blur-sm px-6 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Add Form -->
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-md border border-slate-100 h-fit sticky top-8">
                <h2 id="formTitle" class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-purple-500"></i> Add New Teacher
                </h2>
                <form id="teacherForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Name <span class="text-red-500">*</span></label>
                        <input type="text" id="tName" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Designation</label>
                        <input type="text" id="tDesignation" placeholder="e.g. Senior Instructor" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Subject</label>
                        <input type="text" id="tSubject" placeholder="e.g. Physics" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Image URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="tImage" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                            <button type="button" onclick="document.getElementById('tFile').click()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 rounded-lg text-sm font-medium transition" title="Upload Image">
                                <i class="fa-solid fa-upload"></i>
                            </button>
                        </div>
                        <input type="file" id="tFile" class="hidden" accept="image/*" onchange="uploadImage(this)">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Bio</label>
                        <textarea id="tBio" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Facebook URL</label>
                        <input type="text" id="tFacebook" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">LinkedIn URL</label>
                        <input type="text" id="tLinkedIn" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl shadow-md transition-colors mt-4">
                        <i class="fa-solid fa-plus"></i> Save Teacher
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl shadow-sm transition-colors mt-2">Cancel Edit</button>
                </form>
            </div>

            <!-- List -->
            <div class="md:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-users text-indigo-500"></i> Existing Teachers
                    </h2>
                    <div id="teachersList" class="space-y-4">
                        <div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><p>Loading...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        
        let editingId = null;
        let allTeachers = [];

        window.editTeacher = function(id) {
            const t = allTeachers.find(x => x.id === id);
            if(!t) return;
            
            editingId = id;
            document.getElementById('tName').value = t.name;
            document.getElementById('tDesignation').value = t.designation || '';
            document.getElementById('tSubject').value = t.subject || '';
            document.getElementById('tImage').value = t.imageUrl || '';
            document.getElementById('tBio').value = t.bio || '';
            document.getElementById('tFacebook').value = t.facebookUrl || '';
            document.getElementById('tLinkedIn').value = t.linkedInUrl || '';
            
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen text-blue-500"></i> Edit Teacher';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-save"></i> Update Teacher';
            document.getElementById('submitBtn').classList.replace('bg-purple-600', 'bg-blue-600');
            document.getElementById('submitBtn').classList.replace('hover:bg-purple-700', 'hover:bg-blue-700');
            
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        };

        window.cancelEdit = function() {
            editingId = null;
            document.getElementById('teacherForm').reset();
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-user-plus text-purple-500"></i> Add New Teacher';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-plus"></i> Save Teacher';
            document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-purple-600');
            document.getElementById('submitBtn').classList.replace('hover:bg-blue-700', 'hover:bg-purple-700');
            document.getElementById('cancelEditBtn').classList.add('hidden');
        };

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        async function uploadImage(input) {
            if(!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            const btn = input.previousElementSibling.querySelector('button');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const response = await fetch('/api/Uploads', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                if(response.ok) {
                    const data = await response.json();
                    document.getElementById('tImage').value = data.url;
                } else {
                    alert("Upload failed.");
                }
            } catch(e) {
                alert("Upload error.");
            } finally {
                btn.innerHTML = originalIcon;
                input.value = '';
            }
        }

        async function loadTeachers() {
            try {
                const response = await fetch('/api/Teachers');
                if(!response.ok) throw new Error("Failed");
                const teachers = await response.json();
                allTeachers = teachers;
                
                const list = document.getElementById('teachersList');
                list.innerHTML = '';
                
                if(teachers.length === 0) {
                    list.innerHTML = '<div class="p-8 text-center bg-slate-50 rounded-xl text-slate-500">No teachers found. Add one!</div>';
                    return;
                }

                teachers.forEach(t => {
                    const imgUrl = t.imageUrl || 'https://via.placeholder.com/150';
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-200 hover:border-purple-300 transition">
                            <div class="flex items-center gap-4">
                                <img src="${imgUrl}" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-lg">${t.name}</h3>
                                    <p class="text-sm text-slate-500">${t.designation || ''} ${t.subject ? ' - ' + t.subject : ''}</p>
                                </div>
                            </div>
                            <button onclick="editTeacher(${t.id})" class="text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 w-10 h-10 rounded-full flex items-center justify-center transition mr-2">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteTeacher(${t.id})" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 w-10 h-10 rounded-full flex items-center justify-center transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                });
            } catch(e) {
                document.getElementById('teachersList').innerHTML = '<div class="text-red-500 p-4">Error loading teachers</div>';
            }
        }

        document.getElementById('teacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const teacher = {
                name: document.getElementById('tName').value,
                designation: document.getElementById('tDesignation').value || '',
                subject: document.getElementById('tSubject').value || '',
                imageUrl: uploadedImageUrl || '',
                bio: document.getElementById('tBio').value || '',
                facebookUrl: document.getElementById('tFacebook').value || '',
                linkedInUrl: document.getElementById('tLinkedIn').value || ''
            };

            try {
                
                let url = '/api/Teachers';
                let method = 'POST';
                if(editingId) {
                    url = '/api/Teachers/' + editingId;
                    method = 'PUT';
                    teacher.id = editingId;
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(teacher)
                });
                
                if(response.ok) {
                    cancelEdit();
                    loadTeachers();
                } else {
                    const err = await response.json(); 
                    alert("Failed to save teacher: " + (err.message || JSON.stringify(err)));
                }
            } catch(e) {
                alert("Error connecting to server.");
            } finally {
                btn.innerHTML = editingId ? '<i class="fa-solid fa-save"></i> Update Teacher' : '<i class="fa-solid fa-plus"></i> Save Teacher';
                btn.disabled = false;
            }
        });

        async function deleteTeacher(id) {
            if(!confirm("Are you sure you want to delete this teacher?")) return;
            try {
                const res = await fetch('/api/Teachers/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if(res.ok) {
                    loadTeachers();
                } else {
                    alert("Failed to delete.");
                }
            } catch(e) {
                alert("Error connecting to server.");
            }
        }

        loadTeachers();
    </script>
</body>
</html>
